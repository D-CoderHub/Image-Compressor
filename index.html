<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            background: #222;
            padding: 20px;
        }

        .container {
            background: #333;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            outline: none;
        }

        input, select {
            background: #444;
            color: white;
            border: 1px solid #666;
        }

        select {
            cursor: pointer;
        }

        button {
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2ecc71;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #file-size {
            font-size: 13px;
            margin-top: 5px;
            color: yellow;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
            color: yellow;
        }

        #preview {
            margin-top: 15px;
        }

        canvas {
            max-width: 100%;
            border-radius: 5px;
            border: 1px solid #555;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                max-width: 400px;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                max-width: 350px;
                padding: 15px;
            }
            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Compressor</h1>

        <label for="upload">Choose File 🗃️:</label>
        <input type="file" id="upload" accept="image/*">
        <div id="file-size"></div>
        
        <label for="quality">Quality (0KB - 50MB):</label>
        <input type="number" id="quality" min="0" max="50000" value="5000"> KB
        
        <label for="format">Output Format:</label>
        <select id="format">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WEBP</option>
        </select>

        <button id="compress">Compress Image</button>
        <div id="status"></div>

        <div id="preview">
            <h3>Preview:</h3>
            <canvas id="canvas"></canvas>
        </div>

        <button id="download" disabled>Download</button>
    </div>

    <script>
        const uploadInput = document.getElementById("upload");
        const fileSizeDisplay = document.getElementById("file-size");
        const qualityInput = document.getElementById("quality");
        const statusText = document.getElementById("status");
        const downloadButton = document.getElementById("download");

        uploadInput.addEventListener("change", function () {
            if (uploadInput.files.length > 0) {
                let file = uploadInput.files[0];
                let fileSizeBytes = file.size;
                let fileSizeMB = (fileSizeBytes / (1024 * 1024)).toFixed(2);

                if (fileSizeBytes > 50000000) {
                    fileSizeDisplay.innerHTML = `<span style="color: red;">⚠️ File size too large! Max limit: 50MB</span>`;
                    uploadInput.value = "";
                } else {
                    fileSizeDisplay.innerText = `Original Size: ${fileSizeMB} MB`;
                }
            }
        });

        document.getElementById("compress").addEventListener("click", function () {
            let fileInput = uploadInput.files[0];
            if (!fileInput) {
                alert("Please upload an image.");
                return;
            }

            let maxSizeKB = parseInt(qualityInput.value);
            if (maxSizeKB < 0 || maxSizeKB > 50000) {
                statusText.innerHTML = `<span style="color: red;">⚠️ Enter size between 0KB - 50MB</span>`;
                return;
            }

            let format = document.getElementById("format").value;
            let reader = new FileReader();

            statusText.innerText = "Image Compress⏳";

            reader.onload = function (event) {
                let img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    let canvas = document.getElementById("canvas");
                    let ctx = canvas.getContext("2d");

                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, img.width, img.height);

                    let quality = maxSizeKB * 1024 / fileInput.size;
                    let compressedData = canvas.toDataURL(`image/${format}`, quality);

                    let anchor = document.createElement("a");
                    anchor.href = compressedData;
                    anchor.download = `compressed.${format}`;
                    downloadButton.onclick = () => anchor.click();
                    downloadButton.disabled = false;

                    statusText.innerText = "";
                };
            };

            reader.readAsDataURL(fileInput);
        });
    </script>

</body>
</html>
